[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "master-thesis-ski-analytics"
version = "0.1.0"
description = "Reproducible analytics workspace for a Master's thesis on Swiss ski resorts and Magic Pass."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
